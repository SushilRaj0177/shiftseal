name: Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play version code (one higher than the last upload)'
        required: true
        default: '1'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shiftseal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Signed bundle for Google Play. Runs only when started by hand from the Actions
  # tab, and only with the upload key stored as repository secrets
  # (see docs/PLAY_STORE.md). The key never appears in the repository.
  play-bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD secrets first (docs/PLAY_STORE.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        working-directory: android
        env:
          SHIFTSEAL_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          SHIFTSEAL_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SHIFTSEAL_UPLOAD_KEY_ALIAS: shiftseal-upload
          SHIFTSEAL_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PversionCode=${{ inputs.version_code }}
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: shiftseal-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
